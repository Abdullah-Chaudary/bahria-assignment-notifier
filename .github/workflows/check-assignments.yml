name: Check Assignments

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      retry:
        description: 'Retry attempt number'
        required: false
        default: '0'

jobs:
  check-assignments:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Wait before retry
        if: ${{ github.event.inputs.retry != '0' && github.event.inputs.retry != '' }}
        run: |
          echo "Retry attempt ${{ github.event.inputs.retry }}. Waiting 15 minutes..."
          sleep 900

      - name: Run assignment checker
        env:
          ENROLLMENT_NUMBER: ${{ secrets.ENROLLMENT_NUMBER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          INSTITUTION: ${{ secrets.INSTITUTION || '6' }}
          NOTIFICATION_LEVEL: ${{ secrets.NOTIFICATION_LEVEL || '0' }}
          NOTIFY_EXTENDED: ${{ secrets.NOTIFY_EXTENDED || '1' }}
          RETRY_NUMBER: ${{ github.event.inputs.retry || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.main check

      - name: Save seen assignments cache
        uses: actions/cache@v4
        with:
          path: seen_assignments.json
          key: seen-assign-${{ github.run_id }}
          restore-keys: seen-assign-
